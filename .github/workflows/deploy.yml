name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy changed files via LFTP
        timeout-minutes: 10
        run: |
          lftp -c "
          set ftp:ssl-allow yes;
          set ssl:verify-certificate no;
          set net:timeout 30;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          mirror --reverse --only-newer --verbose --parallel=4 --no-perms \
            --exclude ^\.git/ \
            --exclude ^\.github/ \
            --exclude ^\.claude/ \
            --exclude ^\.claudeignore$ \
            --exclude ^README\.md$ \
            --exclude ^node_modules/ \
            --exclude ^\.DS_Store$ \
            --exclude ^Thumbs\.db$ \
            --exclude ^wp-config\.php$ \
            --exclude ^\.htaccess$ \
            --exclude ^\.user\.ini$ \
            --exclude ^php\.ini$ \
            --exclude ^error_log$ \
            --exclude ^wp-content/cache/ \
            --exclude ^wp-content/uploads/ \
            --exclude ^wp-content/backups/ \
            --exclude ^\.env$ \
            --exclude ^ESOP-ADVISOR-DOCUMENTATION\.md$ \
            --exclude ^ESOP-ADVISOR-QUICKSTART\.md$ \
            ./ /home/esopmark/new.esopmarketplace.com/;
          bye"
