name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy changed files via LFTP
        timeout-minutes: 10
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Create lftp script file
          cat > /tmp/deploy.lftp << 'LFTP_SCRIPT'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          mirror --reverse --only-newer --verbose --parallel=4 --no-perms -x ^\.git/ -x ^\.github/ -x ^\.claude/ -x ^\.claudeignore$ -x ^README\.md$ -x ^node_modules/ -x ^\.DS_Store$ -x ^Thumbs\.db$ -x ^wp-config\.php$ -x ^\.htaccess$ -x ^\.user\.ini$ -x ^php\.ini$ -x ^error_log$ -x ^wp-content/cache/ -x ^wp-content/uploads/ -x ^wp-content/backups/ -x ^\.env$ -x ^ESOP-ADVISOR -x \.backup ./ /home/esopmark/new.esopmarketplace.com/
          quit
          LFTP_SCRIPT

          # Remove leading whitespace from the script file
          sed -i 's/^[[:space:]]*//' /tmp/deploy.lftp

          echo "=== LFTP Script Contents ==="
          cat /tmp/deploy.lftp
          echo ""
          echo "=== Starting Deploy ==="

          # Execute lftp with credentials, pipe script via stdin
          lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_HOST}" < /tmp/deploy.lftp

          echo "=== Deploy Complete ==="
